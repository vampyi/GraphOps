services:
  neo4j:
    image: neo4j:2026.09.0
    container_name: graphops-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # official apache kafka image in kraft mode (no zookeeper): one node is both broker and controller
  kafka:
    image: apache/kafka:4.3.1
    container_name: graphops-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # two listeners: EXTERNAL for clients on the host (localhost:9092), INTERNAL for other containers
      # such as the app service (kafka:29092). a single localhost listener is unreachable across containers.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 2
    volumes:
      - kafka-data:/var/lib/kafka/data

  # the whole app (dashboard + api), seeded with the sample organisation. opt in with a profile so the
  # default `docker compose up -d` still starts only the infrastructure for local development:
  #   docker compose up -d                      # neo4j + kafka, run backend/frontend yourself
  #   docker compose --profile app up --build   # everything, dashboard on http://localhost:8000
  app:
    profiles: ["app"]
    build: .
    container_name: graphops-app
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  kafka-data:
  neo4j-data:
  neo4j-logs:
